# CU-CP-only NTN mobility example for a LEO satellite at 500 km.
# This file intentionally does not configure DU/RU/PHY/MAC/SIB19 NTN features.
# Digital service beams are 15 km hex cells; analog access beams are 7-cell CU-CP eligibility clusters.

cu_cp:
  amf:
    addr: 127.0.1.100
    bind_addr: 127.0.0.1
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  e1ap:
    bind_addr: 127.0.20.1
  f1ap:
    bind_addr: 127.0.10.1
  mobility:
    trigger_handover_from_measurements: false
    cells:
      - nr_cell_id: 0x66c001
        periodic_report_cfg_id: 1
        gnb_id_bit_length: 22

pcap:
  ngap_enable: true
  ngap_filename: /tmp/cu_cp_leo_500km_ngap.pcap
  f1ap_enable: true
  f1ap_filename: /tmp/cu_cp_leo_500km_f1ap.pcap
  e1ap_enable: true
  e1ap_filename: /tmp/cu_cp_leo_500km_e1ap.pcap

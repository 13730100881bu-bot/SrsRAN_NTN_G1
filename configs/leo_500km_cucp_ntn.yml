    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 1024
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 6
        hysteresis_db: 0
        time_to_trigger_ms: 100
        report_interval_ms: 1024
    ntn_location_mobility:
      enabled: true
      # 843 service beams cover the 500 km / 50 deg / 15 km LEO footprint.
      # 137 access beam groups collect nearby service beams for RRC access decisions.
      # max_nof_served_beams=0 keeps all visible beams in the inventory; service capacity is capped below.
      # max_nof_loaded_digital_service_beams=0 would remove the CU-CP cap on beams ready to carry UE traffic.
      beam_table_json_file: configs/leo_500km_beam_table.json
      served_beam_min_elevation_deg: 50.0
      max_nof_served_beams: 0
      max_nof_active_analog_access_beams: 16
      max_nof_loaded_digital_service_beams: 256
      # Prepared target beams are kept briefly for UE moves, then released if unused.
      preheated_beam_hold_time_ms: 5000
      preheated_beam_min_ready_time_ms: 1000
      analog_rebalance_pair_cooldown_ms: 10000
      digital_target_reservation_hold_time_ms: 5000
      served_beam_hopping_enabled: true
      served_beam_hopping_dwell_updates: 3
      multi_beam_load_balancing_enabled: true
      demand_aware_beam_scheduling_enabled: true
      multi_beam_headroom_admission_enabled: true
      multi_beam_load_balancing_min_ue_delta: 2
      multi_beam_load_balancing_max_handovers_per_eval: 1
      multi_beam_load_balancing_handover_cooldown_ms: 30000
      satellite_state_source: circular_orbit
      satellite_state_update_period_ms: 1000
      predictive_service_window_horizon_ms: 10000
      predictive_handover_lead_time_ms: 3000
      circular_orbit_altitude_m: 500000.0
      circular_orbit_inclination_deg: 53.0
      circular_orbit_raan_deg: 0.0
      circular_orbit_argument_of_latitude_deg: 0.0
      measurement_report_period_ms: 0
      time_to_trigger_ms: 1000
      max_report_gap_ms: 750
      location_max_age_ms: 5000
      handover_retry_timeout_ms: 2000
      required_consecutive_location_reports: 3
      boundary_hysteresis_m: 5000.0
      max_horizontal_accuracy_m: 250.0
      core_network_reporting_local_forwarding_enabled: false
      core_network_reporting_amf_control_enabled: true
      core_network_reporting_min_report_interval_ms: 0


cu_up:
  e1ap:
    cu_cp_addr: 127.0.20.1
    bind_addr: 127.0.20.2
  ngu:
    socket:
      - bind_addr: 127.0.0.1
  f1u:
    socket:
      - bind_addr: 127.0.10.1

log:
  filename: /tmp/split_cu_up.log
  all_level: warning
  e1ap_level: warning
  f1u_level: warning
  gtpu_level: warning
  hex_max_size: 256

pcap:
  e1ap_enable: true
  e1ap_filename: /tmp/split_cu_up_e1ap.pcap
  f1u_enable: true
  f1u_filename: /tmp/split_cu_up_f1u.pcap
  n3_enable: true
  n3_filename: /tmp/split_cu_up_n3.pcap

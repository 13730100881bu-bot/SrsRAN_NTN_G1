f1ap:
  cu_cp_addr: 127.0.10.1
  bind_addr: 127.0.10.2

f1u:
  socket:
    - bind_addr: 127.0.10.2

ntn:
  cell_specific_koffset: 1
  ntn_ul_sync_validity_dur: 900
  epoch_time:
    sfn: 0
    subframe_number: 0
  ta_info:
    ta_common: 0.0
    ta_common_drift: 0.0
    ta_common_drift_variant: 0.0
    ta_common_offset: 0.0
  ephemeris_orbital:
    semi_major_axis: 6871000
    eccentricity: 0.0
    periapsis: 0.0
    longitude: 0.0
    inclination: 0.0
    mean_anomaly: 0.0

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1
  sib:
    si_window_length: 5
    si_sched_info:
      - si_period: 16
        si_window_position: 1
        sib_mapping: 19
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/split_du_ntn_sib19_proof.log
  all_level: warning
  f1ap_level: debug
  du_level: info
  mac_level: debug
  phy_level: warning
  radio_level: warning
  broadcast_enabled: false
  hex_max_size: 512

pcap:
  mac_enable: true
  mac_type: dlt
  mac_filename: /tmp/split_du_ntn_sib19_proof_mac.pcap
  f1ap_enable: true
  f1ap_filename: /tmp/split_du_ntn_sib19_proof_f1ap.pcap
  f1u_enable: true
  f1u_filename: /tmp/split_du_ntn_sib19_proof_f1u.pcap

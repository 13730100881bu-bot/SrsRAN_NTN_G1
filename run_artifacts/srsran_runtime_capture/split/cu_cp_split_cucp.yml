cu_cp:
  request_pdu_session_timeout: 30
  amf:
    addr: 127.0.0.1
    port: 38412
    bind_addr: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  e1ap:
    bind_addr: 127.0.20.1
  f1ap:
    bind_addr: 127.0.10.1

log:
  filename: /tmp/split_cu_cp.log
  all_level: warning
  cu_level: info
  rrc_level: info
  ngap_level: warning
  f1ap_level: warning
  e1ap_level: warning
  hex_max_size: 256

pcap:
  ngap_enable: true
  ngap_filename: /tmp/split_cu_cp_ngap.pcap
  f1ap_enable: true
  f1ap_filename: /tmp/split_cu_cp_f1ap.pcap
  e1ap_enable: true
  e1ap_filename: /tmp/split_cu_cp_e1ap.pcap
